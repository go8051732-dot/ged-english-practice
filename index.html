가 있습니다. 줄리아 스미스가 오후 2시에 중앙홀에서 신간 《Harry Botter》에 관해 이야기할 예정입니다. 팬이라면 놓치지 마세요!","options":["기부 방법 설명","화장실 고장 공지","중고 서적 판매 광고","도서관 특별 행사 안내"],"answer":3},{"english":"A: Hi, Judy. You look worried. What’s wrong?\nB: I have to give a speech in English. I’m so nervous.\nA: Don’t worry. You’ll do a good job.","korean":"A: 주디, 걱정스러워 보여. 무슨 일이야?\nB: 영어로 연설해야 해서 너무 긴장돼.\nA: 걱정 마. 잘할 거야.","options":["요리 대회에 출전해서","약속 시간에 늦어서","좋아하는 배우를 만나서","영어로 연설을 해야 해서"],"answer":3},{"english":"The seahorse is a kind of fish, but it looks like a horse. It swims standing up. It moves slowly in the water. When it is in danger, it can change its color. Which is NOT true?","korean":"해마는 물고기의 한 종류지만 말처럼 생겼습니다. 똑바로 선 채 헤엄치며 물속에서 천천히 움직입니다. 위험할 때는 색을 바꿀 수 있습니다. 내용과 일치하지 않는 것은?","options":["말처럼 생겼다.","서서 헤엄친다.","빠르게 이동한다.","색을 바꿀 수 있다."],"answer":2},{"english":"Seho, where are you going? (A) To the library. I need to return these books. (B) Yes, please. Thank you! (C) They look heavy. Do you need any help?","korean":"세호야, 어디 가니? (A) 도서관에요. 이 책들을 반납해야 해요. (B) 네, 부탁드려요. 고맙습니다! (C) 무거워 보이네. 도와줄까? 대화를 올바른 순서로 배열하세요.","options":["(A)-(B)-(C)","(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)"],"answer":1},{"english":"Yesterday, Minsu got on a bus. His card did not have enough money, so he had to get off the bus. He was embarrassed. Why did he get off?","korean":"어제 민수는 버스를 탔습니다. 카드에 잔액이 부족해서 버스에서 내려야 했고, 당황했습니다. 민수가 내린 이유는?","options":["버스를 잘못 타서","목적지에 도착해서","버스가 갑자기 고장 나서","버스 카드 잔액이 부족해서"],"answer":3},{"english":"Classmates’ Birthday Present Wishes: smartphones 45%, bicycles 25%, earphones 13%, watches 10%, books 6%. More students want _____ than bicycles.","korean":"반 친구들이 생일 선물로 원하는 것: 스마트폰 45%, 자전거 25%, 이어폰 13%, 시계 10%, 책 6%. 자전거보다 더 많은 학생이 _____을 원합니다.","options":["smartphones — 스마트폰","earphones — 이어폰","watches — 시계","books — 책"],"answer":0},{"english":"Franz Liszt was born in Hungary in 1811. He began playing the piano at seven and became a great pianist, composer, and teacher. What is NOT mentioned?","korean":"프란츠 리스트는 1811년 헝가리에서 태어났습니다. 일곱 살에 피아노를 시작했고 훌륭한 피아니스트, 작곡가, 교사가 되었습니다. 언급되지 않은 내용은?","options":["작곡한 작품의 수","태어난 나라","피아노를 치기 시작한 나이","직업"],"answer":0},{"english":"The Sahara Desert is very hot. Ants can live there because their bodies reflect the sun’s heat. What does “they” refer to?","korean":"사하라 사막은 매우 덥습니다. 개미는 몸이 태양열을 반사하기 때문에 그곳에서 살 수 있습니다. they가 가리키는 것은?","options":["ants — 개미","bears — 곰","foxes — 여우","lions — 사자"],"answer":0},{"english":"Swimming pool rules: Do not run. Do not eat food. Do not dive into the pool. Which rule is NOT mentioned?","korean":"수영장 규칙: 뛰지 마세요. 음식을 먹지 마세요. 수영장에 다이빙하지 마세요. 언급되지 않은 규칙은?","options":["뛰지 않기","음식 먹지 않기","다이빙하지 않기","사진 촬영하지 않기"],"answer":3},{"english":"There are many good things about using a smartphone. I can contact friends anywhere and easily get information I need. What is the main idea?","korean":"스마트폰 사용에는 좋은 점이 많습니다. 어디서든 친구와 연락할 수 있고 필요한 정보를 쉽게 얻을 수 있습니다. 글의 주제는?","options":["다양한 원격 수업 방법","인터넷 중독의 위험성","스마트폰 사용의 좋은 점","학교 숙제가 필요한 이유"],"answer":2},{"english":"Hello, Dr. Brown. I keep buying things I don’t need and have many unnecessary things. I want to break this bad habit. What should I do?","korean":"브라운 박사님, 안녕하세요. 필요하지 않은 물건을 계속 사서 불필요한 물건이 많아졌습니다. 이 나쁜 습관을 고치고 싶은데 어떻게 해야 할까요? 글을 쓴 목적은?","options":["조언을 구하기 위해서","환불을 요청하기 위해서","주말 약속을 잡기 위해서","전시회를 소개하기 위해서"],"answer":0},{"english":"People dance to express feelings, give happiness to others, or enjoy themselves. Now let’s look at different kinds of dance around the world. What will follow?","korean":"사람들은 감정을 표현하고, 다른 사람에게 기쁨을 주거나, 즐기기 위해 춤을 춥니다. 이제 세계 여러 지역의 다양한 춤을 살펴보겠습니다. 이어질 내용은?","options":["여러 나라의 인사법","세계의 다양한 춤 소개","감정을 잘 표현하는 방법","책을 많이 읽어야 하는 이유"],"answer":1}]},{"year":2022,"round":2,"label":"2022년 제2회","questions":[{"english":"He is a very famous singer and has a lot of fans.","korean":"그는 매우 유명한 가수이고 팬이 많습니다.","options":["unique — 독특한","famous — 유명한","kind — 친절한","comfortable — 편안한"],"answer":1},{"english":"rise-fall / win-lose / ope n contests. Which sentence does not fit?","korean":"소피는 바이올린을 연주하고 오케스트라 경험이 많습니다. 바이올린은 기타보다 작습니다. 여러 바이올린 대회에서 우승했습니다. 흐름과 어울리지 않는 문장은?","options":["ⓐ 바이올린을 연주한다","ⓑ 오케스트라 경험이 많다","ⓒ 바이올린은 기타보다 작다","ⓓ 바이올린 대회에서 우승했다"],"answer":2},{"english":"Mike went to the library to find books for a science project. He found them but could not borrow them because he left his library card at home.","korean":"마이크는 과학 과제에 필요한 책을 찾으러 도서관에 갔습니다. 책을 찾았지만 도서관 카드를 집에 두고 와서 빌리지 못했습니다. 이유는?","options":["이미 책을 너무 많이 빌려서","필요한 책이 도서관에 없어서","도서관 카드를 집에 두고 와서","도서관 공사로 대출이 중단되어서"],"answer":2},{"english":"Our Classmates’ Birthday Present Wishes: smartphones 45%, bicycles 25%, watches 15%, earphones 13%, books 6%. More students want _____ than bicycles.","korean":"반 친구들이 원하는 생일 선물: 스마트폰 45%, 자전거 25%, 시계 15%, 이어폰 13%, 책 6%. 자전거보다 더 많은 학생이 _____을 원합니다.","options":["smartphones — 스마트폰","earphones — 이어폰","watches — 시계","books — 책"],"answer":0},{"english":"David introduces his family. His younger sister Christine is in third grade. His father is a teacher and his mother is a doctor. What is NOT mentioned?","korean":"데이비드는 가족을 소개합니다. 여동생 크리스틴은 초등학교 3학년이고, 아버지는 교사, 어머니는 의사입니다. 언급되지 않은 내용은?","options":["글쓴이의 이름","여동생의 학년","아버지의 직업","어머니의 나이"],"answer":3},{"english":"Close your eyes and press them gently with your fingers. Cover your eyes with warm towels to relax them. What does “them” refer to?","korean":"눈을 감고 손가락으로 부드럽게 눌러 주세요. 따뜻한 수건으로 눈을 덮으면 눈이 편안해집니다. them은 무엇을 가리키나요?","options":["eyes — 눈","hands — 손","towels — 수건","glasses — 안경"],"answer":0},{"english":"National Park Rules: Don’t ride a bike. Don’t feed the birds. Don’t sit on the grass. Which rule is not mentioned?","korean":"국립공원 규칙: 자전거를 타지 마세요. 새에게 먹이를 주지 마세요. 잔디에 앉지 마세요. 언급되지 않은 것은?","options":["자전거 타지 않기","쓰레기 버리지 않기","새에게 먹이 주지 않기","잔디에 앉지 않기"],"answer":1},{"english":"Robots take orders at restaurants, make coffee at cafés, and work as guides at airports. What is the main idea?","korean":"로봇은 식당에서 주문을 받고, 카페에서 커피를 만들며, 공항에서 안내원으로 일합니다. f elevators.","korean":"화재가 났을 때의 안전 수칙입니다. 젖은 천으로 입을 가리고 엘리베이터 대신 계단을 이용하세요. 방송의 목적은?","options":["기상 악화 예보","일정 변경 공지","건물 내 시설 소개","화재 안전 수칙 안내"],"answer":3},{"english":"A: We need to change tomorrow’s meeting time. It’s too early.\nB: How about 10 a.m.?\nA: That’s much better.","korean":"A: 내일 회의 시간을 바꿔야 해요. 너무 일러요.\nB: 오전 10시는 어때요?\nA: 훨씬 낫네요. 시간을 바꾸려는 이유는?","options":["늦게 도착해서","교통 체증이 심해서","회의 시간이 길어서","너무 이른 시간이어서"],"answer":3},{"english":"A cookie cup is an eco-friendly cookie shaped like a cup. After using it, you can eat it instead of throwing it away, making less trash. Which is NOT true?","korean":"쿠키 컵은 컵 모양의 친환경 쿠키입니다. 사용한 뒤 버리는 대신 먹을 수 있어 쓰레기를 줄일 수 있습니다. 일치하지 않는 것은?","options":["친환경 제품이다","유리로 만든다","먹을 수 있다","쓰레기를 줄일 수 있다"],"answer":1},{"english":"I want to win the singing contest. I love singing and have a good voice. I’m a poor tennis player. I’m too shy to sing before many people. Which sentence does not fit?","korean":"학교 노래 대회에서 우승하고 싶습니다. 노래를 좋아하고 목소리도 좋다고 생각합니다. 테니스를 아주 못합니다. 많은 사람 앞에서 노래하기에는 너무 수줍습니다. 흐름과 어울리지 않는 문장은?","options":["ⓐ 노래하는 것을 좋아한다","ⓑ 목소리가 좋다고 생각한다","ⓒ 테니스를 매우 못한다","ⓓ 사람들 앞에서 노래하기 수줍다"],"answer":2},{"english":"Gina saw a little dog with a broken leg. She suggested taking it to an animal doctor.","korean":"지나는 다리가 부러진 것 같은 작은 개를 보았습니다. 수의사에게 데려가자고 제안했습니다. 지나가 제안한 것은?","options":["아침 일찍 일어나기","개를 공원에서 산책시키기","친구와 함께 공부하기","개를 수의사에게 데려가기"],"answer":3},{"english":"Favorite Club Activities at Daehan School: drawing cartoons 40%, riding a bicycle 17%, baking cookies 30%, playing guitar 13%. The most popular activity is _____.","korean":"대한학교의 인기 동아리 활동: 만화 그리기 40%, 자전거 타기 17%, 쿠키 굽기 30%, 기타 연주 13%. 가장 인기 있는 활동은?","options":["drawing cartoons — 만화 그리기","riding a bicycle — 자전거 타기","baking cookies — 쿠키 굽기","playing the guitar — 기타 연주"],"answer":0},{"english":"David is good at painting and wants to be a famous artist like Van Gogh. His favorite painting is The Starry Night. What is NOT mentioned?","korean":"데이비드는 그림을 잘 그리고 반 고흐처럼 유명한 화가가 되고 싶어 합니다. 가장 좋아하는 그림은 《별이 빛나는 밤》입니다. 언급되지 않은 것은?","options":["잘하는 것","출신 학교","장래 희망","가장 좋아하는 그림"],"answer":1},{"english":"Bees give us honey. Honey is a wonderful food. Bees also help produce fruits such as apples and peaches. What does “It” refer to?","korean":"벌은 우리에게 꿀을 줍니다. 꿀은 훌륭한 음식입니다. 벌은 사과와 복숭아 같은 과일이 열리도록 돕기도 합니다. It은 무엇을 가리키나요?","options":["bird — 새","honey — 꿀","apple — 사과","peach — 복숭아"],"answer":1},{"english":"Class rules: Help each other. Take notes in class. Bring your textbooks. Which rule is not mentioned?","korean":"수업 규칙: 서로 돕기, 수업 시간에 필기하기, 교과서 가져오기. 언급되지 않은 규칙은?","options":["활동 시간 지키기","서로 도와주기","수업 중 필기하기","교과서 가져오기"],"answer":0},{"english":"A good leader is friendly, gives advice, and listens carefully to others. What is the main idea?","korean":"좋은 리더는 친절하고 사람들과 대화하기 편하며, 조언을 해 주고 다른 사람의 말을 주의 깊게 듣습니다. 글의 주제는?","options":["조언의 필요성","좋은 리더의 특징","아침 식사의 중요성","운동을 해야 하는 이유"],"answer":1},{"english":"Thank you for inviting me to your home. I had a good time and enjoyed the food. Thank you for showing me how to cook tteokbokki.","korean":"지난 금요일 집에 초대해 줘서 고마워. 즐거운 시간을 보냈고 음식도 맛있었어. 떡볶이 만드는 법을 알려줘서 고마워. 편지의 목적은?","options":["감사","거절","불평","사과"],"answer":0},{"english":"Smartphones can cause dry eyes and neck pain. Here are some tips to solve these problems. What will follow?","korean":"스마트폰은 눈을 자주 깜빡이지 않게 해 안구 건조를 일으킬 수 있고, 고개를 숙여 목 통증을 유발할 수 있습니다. 이런 문제를 해결하는 팁을 소개하겠습니다. 이어질 내용은?","options":["스마트폰 요금제를 선택하는 방법","스마트폰 종류별 특징과 수리 방법","스마트폰을 저렴하게 사는 방법","스마트폰 건강 문제의 해결 방법"],"answer":3}]},{"year":2023,"round":2,"label":"2023년 제2회","questions":[{"english":"I love my friends. They’re very special to me.","korean":"나는 친구들을 사랑해요. 친구들은 내게 아주 특별해요.","options":["strict — 엄격한","brave — 용감한","special — 특별한","wise — 현명한"],"answer":2},{"english":"fast-slow / large-big / late-early / long-short","korean":"각 단어 쌍의 의미 관계가 다릅니다.","options":["fast-slow: 반의어","large-big: 비슷한 뜻","late-early: 반의어","long-short: 반의어"],"answer":1},{"english":"There _____ a big tree in front of my house.","korean":"우리 집 앞에 큰 나무가 한 그루 있습니다.","options":["be","is","are","were"],"answer":1},{"english":"She didn’t eat dessert _____ she was too full.","korean":"그녀는 너무 배불러서 디저트를 먹지 않았습니다.","options":["to — ~쪽으로","by — ~옆에","from — ~로부터","because — 왜냐하면"],"answer":3},{"english":"A: _____ do you think of my new skirt?\nB: It looks good on you.","korean":"A: 내 새 치마 어때?\nB: 너한테 잘 어울려.","options":["Who — 누구","What — 무엇","Where — 어디","Which — 어느 것"],"answer":1},{"english":"A: I can’t walk. I broke my leg yesterday.\nB: _____.","korean":"A: 걸을 수가 없어. 어제 다리가 부러졌어.\nB: _____.","options":["Yes, I am — 네, 그래요","Nice to meet you — 만나서 반가워","You’re welcome — 천만에","I’m sorry to hear that — 안됐구나"],"answer":3},{"english":"It’s _____ outside. You should wear a coat.\nHe said he had a sore throat. Did he catch a _____?","korean":"밖은 _____해. 코트를 입는 게 좋겠어.\n그는 목이 아프다고 했어. 감기에 걸린 걸까?","options":["cold — 추운 / 감기","soft — 부드러운","tall — 키 큰","well — 건강한"],"answer":0},{"english":"A: How can I get to City Hall?\nB: Go straight one block and turn right. It’s on your left.","korean":"A: 시청에 어떻게 가나요?\nB: 한 블록 곧장 가서 오른쪽으로 도세요. 왼쪽에 있어요. 지도에서 시청 위치는?","options":["① 지도 왼쪽 위","② 지도 오른쪽 위","③ 지도 왼쪽 아래","④ 지도 오른쪽 아래"],"answer":3,"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfgAAAF0CAIAAABAOLyLAACHZElEQVR4nO39dVwU6/s4/u/MFiws3d2ilIQBKlIGGNhHTOzGY3fHMTgGx9Zz7ESxW5AQFcQAQcWgu2uXXXZn9vd4eX/e+9vvgriAHj3r9fwL7pmdnmvuuWswkUhEAQAAIL/wH70BAAAAvi8I9AAAIOcg0AMAgJyDQA8AAHIOAj0AAMg5CPQAACDnINADAICcg0APAAByDgI9AADIOQj0AAAg5yDQAwCAnINADwAAcg4CPQAAyDkI9AAAIOcg0AMAgJyDQA8AAHIOAj0AAMg5CPQAACDnINADAICcg0APAAByDgI9AADIOQj0AAAg5yDQAwCAnINADwAAcg4CPQAAyDkI9AAAIOcg0AMAgJyDQA8AAHIOAj0AAMg5CPQAACDnINADAICcg0APAAByDgI9AADIOQj0AAAg5yDQAwCAnINADwAAcg4CPQAAyDkI9AAAIOcg0AMAgJyDQA8AAHIOAj0AAMg5CPQAACDnINADAICco33DZWVmZj569IhGozk7O9va2rZiCSkpKenp6erq6i4uLhoaGq3eEh6P9/Dhw/r6emNjYxcXFyqVSvnJZGZmPn78mMFguLm5mZubt2IJxcXF0dHROI7b2to6ODh88y1MTk5OTU1VUVHp0qWLjo4O5edTVFQUGRmpoKBga2trZ2fXuoWgw0ilUjt8RvkOYmNjs7OzVVRUPD091dX ook so happy today. What’s up?\nB: _____.\nA: Where did you find your dog?\nB: He was in the park near my house.","korean":"A: 오늘 정말 행복해 보이네. 무슨 일이야?\nB: _____.\nA: 개를 어디서 찾았어?\nB: 우리 집 근처 공원에 있었어.","options":["I failed the test — 시험에 떨어졌어","I’m a Canadian — 나는 캐나다 사람이야","I found my missing dog — 잃어버린 개를 찾았어","I don’t like vegetables — 채소를 좋아하지 않아"],"answer":2},{"english":"A: What’s your plan for this vacation?\nB: I plan to take guitar lessons. How about you?\nA: I’m going to visit my grandparents in Jeju-do.","korean":"A: 이번 방학 계획이 뭐야?\nB: 기타 수업을 들을 거야. 너는?\nA: 제주도에 계신 조부모님을 찾아뵐 거야.","options":["친구 관계","방학 계획","생일 선물","운동 추천"],"answer":1},{"english":"A class poster gives its course date, place, and activities. What information is not included?","korean":"수업 홍보문에서 수업 날짜, 장소, 활동은 확인할 수 있습니다. 알 수 없는 것은?","options":["수업 날짜","수업 장소","수업료","수업 활동"],"answer":2},{"english":"Tomorrow is Sports Day. Wear comfortable clothes and shoes, follow the rules, and stay with classmates. What is the announcement for?","korean":"내일은 운동회입니다. 편한 옷과 신발을 착용하고, 규칙을 지키며, 행사 중에는 반 친구들과 함께 있어 주세요. 방송의 목적은?","options":["지역 특산물 소개","체육 대회 유의 사항 설명","백화점 행사 홍보","학교 식당 공사 일정 안내"],"answer":1},{"english":"A: I want to travel to Nepal someday.\nB: What makes you want to go there?\nA: I want to climb the wonderful mountains.","korean":"A: 언젠가 네팔에 여행 가고 싶어.\nB: 왜 가고 싶어?\nA: 멋진 산에 오르고 싶어. 이유는?","options":["멋진 산을 오르고 싶어서","은하수 사진을 찍고 싶어서","외국인 친구를 사귀고 싶어서","새로운 문화를 경험하고 싶어서"],"answer":0},{"english":"The White Winter Festival starts in the last week of January and lasts five days. People can ice-fish and join a snowman contest. Musicians play live music at night. Which is NOT true?","korean":"화이트 윈터 축제는 1월 마지막 주에 시작해 5일 동안 열립니다. 얼음낚시와 눈사람 만들기 대회를 즐길 수 있고, 음악가들은 밤에 라이브 공연을 합니다. 일치하지 않는 것은?","options":["1월 마지막 주에 시작한다","얼음낚시를 즐길 수 있다","눈사람 만들기 대회가 있다","음악가들이 오전에 공연을 한다"],"answer":3},{"english":"Elena is from France. She wants to be a fashion designer. She visited Korea in 2020 and loved hanbok. What is not mentioned?","korean":"엘레나는 프랑스 출신입니다. 패션 디자이너가 되고 싶고 2020년에 한국을 방문해 한복을 좋아하게 되었습니다. 언급되지 않은 것은?","options":["출신 국가","장래 희망","한국 방문 연도","반려동물"],"answer":3},{"english":"Susan and I saw ugly walls around the school. Susan suggested painting pictures on them.","korean":"수전과 나는 학교 주변의 지저분한 벽을 보았습니다. 수전은 벽에 그림을 그리자고 제안했습니다. 수전이 제안한 것은?","options":["벽에 그림 그리기","밝게 인사하기","청바지 재활용하기","선생님 찾아뵙기"],"answer":0},{"english":"Favorite movies at Han-guk School: action 22%, comedy 38%, horror 16%, sci-fi 14%, others 10%. Students like _____ the most.","korean":"한국학교의 좋아하는 영화: 액션 22%, 코미디 38%, 공포 16%, SF 14%, 기타 10%. 학생들이 가장 좋아하는 장르는?","options":["action — 액션","comedy — 코미디","horror — 공포","sci-fi — 공상 과학"],"answer":1},{"english":"Jiho’s father runs a restaurant and makes spaghetti. Jiho will practice cooking spaghetti with him. Which sentence does not fit?","korean":"지호의 아버지는 작은 식당을 운영하며 스파게티를 만듭니다. 지호는 이번 주에 아버지와 함께 스파게티 요리를 연습할 예정입니다. 흐름과 어울리지 않는 문장은?","options":["① 아버지는 훌륭한 스파게티를 만든다","② 지호는 요리하는 법을 배우고 싶어 한다","③ 아버지와 스파게티 요리를 연습할 것이다","④ 햄버거가 지호가 가장 좋아하는 음식이다"],"answer":3},{"english":"Newly designed buses have no steps and low floors. Even wheelchair users can use them without help. What does “them” refer to?","korean":"새로 설계된 버스는 계단이 없고 바닥이 낮습니다. 휠체어를 탄 사람도 도움 없이 이용할 수 있습니다. them은 무엇을 가리키나요?","options":["books — 책","buses — 버스","people — 사람들","windows — 창문"],"answer":1},{"english":"Camping rules: Don’t pitch your tent next to the river. Don’t feed wild animals. Don’t leave trash behind. Which is not mentioned?","korean":"캠핑 규칙: 강 바로 옆에 텐트를 치지 마세요. 야생 동물에게 먹이를 주지 마세요. 쓰레기를 남기지 마세요. 언급되지 않은 것은?","options":["강 바로 옆에 텐트 치지 않기","야생 동물에게 먹이 주지 않기","쓰레기 남겨 두지 않기","텐트 안에서 요리하지 않기"],"answer":3},{"english":"Going outdoors and exercising can help you feel better when you feel down. What is the main idea?","korean":"기분이 가라앉았을 때 밖에 나가 햇볕을 쬐고 운동하면 기분이 좋아질 수 있습니다. 글의 주제는?","options":["수면과 건강의 관계","다양한 호르몬의 역할","지구 온난화의 원인","기분이 나아지게 하는 방법"],"answer":3},{"english":"The music club is preparing for a school concert and asks to use Mr. Brown’s classroom for practice. Why was this written?","korean":"음악 동아리가 학교 음악회를 준비하고 있어 브라운 선생님의 교실을 연습 장소로 사용해도 되는지 묻고 있습니다. 글을 쓴 목적은?","options":["과제를 확인하기 위해서","봉사 활동에 지원하기 위해서","교실 사용을 허락받기 위해서","마을 축제에 초대하기 위해서"],"answer":2},{"english":"Markets help people learn about a country’s culture, meet people, learn history, and taste local food. The writer will introduce famous markets around the world.","korean":"시장은 한 나라의 문화를 배우고 사람들을 만나며 역사와 현지 음식을 경험하기 좋은 곳입니다. 이어서 세계의 유명한 시장을 소개합니다.","options":["다양한 조리 방법 제안","용돈 관리의 중요성 강조","세계의 유명한 시장들 소개","외국어 학습의 이유 설명"],"answer":2}]},{"year":2024,"round":1,"label":"2024년 제1회","questions":[{"english":"Everyone thinks that ice cream is delicious.","korean":"모두 아이스크림이 맛있다고 생각합니다.","options":["easy — 쉬운","possible — 가능한","delicious — 맛있는","interesting — 흥미로운"],"answer":2},{"english":"big-small / dry-wet / old-young / tall-high","korean":"각 단어 쌍의 의미 관계가 다릅니다.","options":["big-small: 반의어","dry-wet: 반의어","old-young: 반의어","tall-high: 비슷한 뜻"],"answer":3},{"english":"A lot of students _____ standing in line.","korean":"많은 학생들이 줄을 서 있습니다.","options":["am","is","was","were"],"answer":3},{"english":"How _____ does it take to go to the train station?","korean":"기차역까지 가는 데 얼마나 오래 걸리나요?","options":["long — 오래","many — 많은","often — 자주","tall — 키가 큰"],"answer":0},{"english":"A: _____ do you usually get up?\nB: I usually get up at seven.","korean":"A: 보통 몇 시에 일어나니?\nB: 보통 7시에 일어나.","options":["How — 어떻게","What — 무엇","When — 언제","Which — 어느 것"],"answer":2},{"english":"A: Can you ride a bike?\nB: _____.","korean":"A: 자전거 탈 수 있어?\nB: _____.","options":["Yes, I can — 응, 탈 수 있어","No, I don’t — 아니, 안 그래","Yes, you can — 응, 너는 탈 수 있어","No, I’m not — 아니, 그렇지 않아"],"answer":0},{"english":"I play the piano in my _____ time.\nYou can have this candy for _____.","korean":"나는 _____ 시간에 피아노를 쳐.\n이 사탕은 _____ 가져도 돼.","options":["busy — 바쁜","close — 가까운","free — 자유로운/여가의","hard — 어려운"],"answer":2},{"english":"Weekend chor : How’s the weather outside?\nB: It’s raining. _____?\nA: No, I don’t. I have to buy one.","korean":"A: 밖에 날씨가 어때?\nB: 비가 와. _____?\nA: 아니, 없어. 하나 사야 해.","options":["What time is it — 몇 시야","How have you been — 어떻게 지냈어","Where did you get it — 어디서 샀어","Do you have an umbrella — 우산 있어"],"answer":3},{"english":"A: We need to change the meeting time. It’s too early.\nB: What about 10 a.m.?\nA: That’s much better.","korean":"A: 회의 시간을 바꿔야 해요. 너무 일러요.\nB: 오전 10시는 어때요?\nA: 훨씬 낫네요.","options":["회의 시간 변경","회의 장소 변경","회의 주제 변경","회의 참가자 변경"],"answer":0},{"english":"World Food Festival: April 13th–14th, 11 a.m.–4 p.m., Riverside Park. Come and enjoy food from all over the world. What cannot be known?","korean":"세계 음식 축제: 4월 13~14일 오전 11시~오후 4시, 리버사이드 공원에서 열립니다. 세계 각국의 음식을 즐기세요. 알 수 없는 것은?","options":["행사 날짜","행사 시간","행사 장소","행사 참가비"],"answer":3},{"english":"The lunch menu has changed. Milk will be served instead of orange juice. What is the announcement for?","korean":"점심 메뉴가 바뀌었습니다. 오렌지주스 대신 우유를 제공합니다. 방송의 목적은?","options":["기부금 모금","학교 규칙 안내","새로운 요리사 소개","점심 메뉴 변경 공지"],"answer":3},{"english":"A: Steve and I are going to the swimming pool. Do you want to join us?\nB: Sorry, I’m taking a trip with my family this weekend.","korean":"A: 스티브와 수영장에 갈 건데 같이 갈래?\nB: 미안하지만 이번 주말에 가족과 여행을 가. 수영장에 못 가는 이유는?","options":["수학 시험이 있어서","가족 여행을 가야 해서","치과 예약이 있어서","축구 경기를 해야 해서"],"answer":1},{"english":"The Moai are human-shaped stones on Easter Island. Most are about four meters tall; the tallest is around 20 meters. Which is NOT true?","korean":"모아이는 이스터섬에 있는 사람 모양의 돌입니다. 대부분 약 4미터이고 가장 큰 것은 약 20미터입니다. 주로 마을을 향하며 일부는 바다를 바라봅니다. 일치하지 않는 것은?","options":["이스터섬에 있다","사람 모양의 돌이다","대부분 높이가 약 20미터이다","주로 마을 쪽을 보고 있다"],"answer":2},{"english":"City Flea Market is open every Saturday in front of the History Museum. You can buy clothes, shoes, books, and toys at low prices. What is not mentioned?","korean":"시티 벼룩시장은 매주 토요일 역사 박물관 앞에서 열립니다. 옷, 신발, 책, 장난감을 저렴하게 살 수 있습니다. 언급되지 않은 것은?","options":["열리는 요일","열리는 장소","주차 정보","판매 품목"],"answer":2},{"english":"Jimin suggested making a study group because studying with friends could help improve test scores.","korean":"시험 성적이 좋지 않아 지민에게 조언을 구했습니다. 지민은 친구들과 공부하면 성적을 높이는 데 도움이 될 수 있다며 스터디 그룹을 만들자고 했습니다.","options":["친구들과 함께 공부하기","조용한 공부 장소 찾기","시험 공부 계획 세우기","선생님께 질문하기"],"answer":0},{"english":"Our Classmates’ Interests: playing sports 45%, computer games 25%, listening to music 15%, reading books 10%, other 5%. More than 40% are interested in _____.","korean":"반 친구들의 관심사: 운동 45%, 컴퓨터 게임 25%, 음악 듣기 15%, 독서 10%, 기타 5%. 40%가 넘는 학생들이 관심 있는 것은?","options":["playing sports — 운동하기","playing computer games — 컴퓨터 게임하기","listening to music — 음악 듣기","reading books — 책 읽기"],"answer":0},{"english":"Last year I went to a mountain. I took a cable car, hiked to the top, and saw beautiful autumn leaves. My father bought a new car. Which sentence does not fit?","korean":"작년에 산에 가서 케이블카를 타고 정상까지 걸어 올라갔습니다. 정상에서 아름다운 단풍을 보았습니다. 흐름과 어울리지 않는 문장은?","options":["① 케이블카를 탔다","② 아버지가 새 차를 샀다","③ 정상까지 걸어 올라갔다","④ 아름다운 단풍을 보았다"],"answer":1},{"english":"Walking offers health benefits, may help prevent diseases, and requires no special equipment. What does “It” refer to?","korean":"걷기는 건강에 도움이 되고, 특정 질병을 예방하는 데 도움을 줄 수 있으며, 특별한 장비가 필요하지 않습니다. It은 무엇을 가리키나요?","options":["Equipment — 장비","Life — 삶","Stress — 스트레스","Walking — 걷기"],"answer":3},{"english":"Library rules: Return books on time. Do not make loud noises. Do not eat food. Which rule is not mentioned?","korean":"도서관 규칙: 책을 제시간에 반납하기, 큰 소리 내지 않기, 음식 먹지 않기. 언급되지 않은 규칙은?","options":["제시간에 책 반납하기","시끄럽게 하지 않기","음식 먹지 않기","책에 낙서하지 않기"],"answer":3},{"english":"When there is a fire, shout “Fire!”, cover your face with a wet towel, stay low, use the stairs, and call 119. What is the main idea?","korean":"불이 났을 때는 “불이야!”라고 외치고, 젖은 수건으로 얼굴을 가린 뒤 낮은 자세로 계단을 이용해 대피하고 119에 전화하세요. 글의 주제는?","options":["건강한 식생활 방법","지진의 원인과 대처법","화재 발생 시 행동 요령","전자 제품 사용 시 유의점"],"answer":2},{"english":"John reports that the traffic lights on Main Street are broken and asks someone to check them right away.","korean":"존 브라운은 메인 스트리트의 신호등이 고장 난 것을 신고하며 사고가 걱정되니 바로 확인해 달라고 요청합니다. 글의 목적은?","options":["사과하려고","신고하려고","축하하려고","홍보하려고"],"answer":1},{"english":"Yoga can build strength and balance and may help manage pain and stress. The writer will introduce various types of yoga.","korean":"요가는 힘과 균형을 기르는 운동이며 통증과 스트레스를 관리하는 데 도움이 될 수 있습니다. 여러 종류의 요가를 소개하려 합니다. 이어질 내용은?","options":["요가의 좋은 점","다양한 요가의 유형","요가가 시작된 나라","요가할 때 주의할 점"],"answer":1}]},{"year":2024,"round":2,"label":"2024년 제2회","questions":[{"english":"I feel shy when I speak in front of people.","korean":"사람들 앞에서 말할 때 부끄럽습니다.","options":["thankful — 고마운","excited — 신나는","tired — 피곤한","shy — 부끄러운"],"answer":3},{"english":"rich-poor / kind-nice / clean-dirty / full-empty","korean":"각 단어 쌍의 의미 관계가 다릅니다.","options":["rich-poor: 반의어","kind-nice: 비슷한 뜻","clean-dirty: 반의어","full-empty: 반의어"],"answer":1},{"english":"There _____ many wonderful places in Korea.","korean":"한국에는 멋진 장소가 많이 있습니다.","options":["are","be","is","was"],"answer":0},{"english":"I called him yesterday, _____ he didn’t answer.","korean":"어제 그에게 전화했지만 받지 않았습니다.","options":["but — 그러나","of — ~의","to — ~쪽으로","with — ~와 함께"],"answer":0},{"english":"A: _____ color do you like more, yellow or blue?\nB: I prefer blue to yellow.","korean":"A: 노란색과 파란색 중 어느 색을 더 좋아하니?\nB: 노란색보다 파란색이 더 좋아.","options":["How — 어떻게","Where — 어디","Which — 어느 것","Why — 왜"],"answer":2},{"english":"A: What’s the matter, John? Are you okay?\nB: I hurt my back when I lifted a box yesterday.\nA: _____.","korean":"A: 존, 무슨 일이야? 괜찮아?\nB: 어제 상자를 들다가 허리를 다쳤어.\nA: _____.","options":["That’s too bad — 안됐구나","I’m afraid I can’t — 미안하지만 못 하겠어","I look forward to it — 기대돼","Turn off the water — 물을 잠가"],"answer":0},{"english":"Please take a _____ at this picture.\nHe will _____ after my dog when I’m away.","korean":"이 그림을 _____ 보세요.\n내가 없을 때 그가 우리 개를 _____ 돌봐 줄 거예요.","options":["buy — 사다","look — 보다/돌보다","tell — 말하다","w rary and study together.\nB: Okay.","korean":"A: 오늘 오후에 시간 있어?\nB: 응, 왜?\nA: 도서관에 가서 같이 공부하자.\nB: 좋아.","options":["집에서 숙제하기","서점에서 책 읽기","학교에서 수업 듣기","도서관에서 공부하기"],"answer":3},{"english":"A: What should we do for Jane’s birthday?\nB: Let’s have dinner at her favorite restaurant.\nA: _____.","korean":"A: 제인 생일에 무엇을 하면 좋을까?\nB: 제인이 좋아하는 식당에서 저녁을 먹자.\nA: _____.","options":["He must be tired — 그는 피곤한 게 틀림없어","Nice to meet you — 만나서 반가워","That’s a good idea — 좋은 생각이야","It’s not your fault — 네 잘못이 아니야"],"answer":2},{"english":"A: What do you do in your free time?\nB: I like watching movies.\nA: I enjoy playing the guitar.","korean":"A: 여가 시간에 무엇을 해?\nB: 영화 보는 것을 좋아해.\nA: 나는 기타 치는 것을 즐겨.","options":["여가 활동","영화 예매","음악 감상","여행 계획"],"answer":0},{"english":"A summer science camp poster lists its place, date, and activities. What information is not included?","korean":"여름 과학 캠프 안내에는 장소, 날짜, 활동이 적혀 있습니다. 알 수 없는 것은?","options":["행사 장소","행사 날짜","참가 인원","신청 방법"],"answer":2},{"english":"The musical will start soon. Turn off your phones and do not take photos during the show. What is the announcement for?","korean":"뮤지컬이 곧 시작합니다. 휴대전화를 끄고 공연 중 사진 촬영을 삼가 주세요. 방송의 목적은?","options":["관람 예절 안내","예매 방법 설명","장소 변경 공지","출연 배우 소개"],"answer":0},{"english":"A: I can’t come to our club meeting today.\nB: Why not?\nA: I have a bad cold.","korean":"A: 오늘 동아리 모임에 못 갈 것 같아.\nB: 왜 못 와?\nA: 심한 감기에 걸렸어.","options":["감기에 걸려서","날씨가 너무 추워서","콘서트에 가야 해서","친구와 약속이 있어서"],"answer":0},{"english":"Songkran is a big festival in Thailand held in April for the traditional Thai New Year. People enjoy water fights and traditional food. Which is NOT true?","korean":"송크란은 태국의 전통 새해를 기념하는 큰 축제로 4월에 열립니다. 물싸움을 하고 태국 전통 음식을 맛볼 수 있습니다. 일치하지 않는 것은?","options":["태국에서 4월에 열리는 큰 축제이다","태국의 전통적인 새해맞이 행사이다","축제 기간 동안 소싸움을 즐길 수 있다","태국 전통 음식을 맛볼 수 있다"],"answer":2},{"english":"The Siberian tiger is the world’s biggest cat. It lives in eastern Russia, has orange fur with black stripes, and eats large animals such as deer. What is not mentioned?","korean":"시베리아 호랑이는 세계에서 가장 큰 고양잇과 동물입니다. 러시아 동부의 추운 곳에 살며 검은 줄무늬가 있는 주황색 털을 가졌고 사슴 같은 큰 동물을 먹습니다. 언급되지 않은 것은?","options":["서식지","수명","털 무늬","먹이"],"answer":1},{"english":"Yumi suggested making a list of things to do because the writer often forgets things, such as a soccer uniform.","korean":"글쓴이는 할 일을 자주 잊어버려 유미에게 조언을 구했습니다. 유미는 할 일 목록을 만들자고 제안했습니다.","options":["축구 연습하기","운동복 구매하기","전문가와 상담하기","할 일 목록 작성하기"],"answer":3},{"english":"Favorite smartphone activities: social media 41%, games 23%, videos 36%. More students like _____ than watching videos.","korean":"좋아하는 스마트폰 활동: 소셜 미디어 41%, 게임 23%, 동영상 36%. 동영상 시청보다 더 많은 학생이 좋아하는 활동은?","options":["using social media — 소셜 미디어 이용","playing games — 게임하기","watching videos — 동영상 보기","texting friends — 친구에게 문자하기"],"answer":0},{"english":"My favorite season is summer. I enjoy the beach, swimming, and ice cream. Earth’s ice is melting fast. Which sentence does not fit?","korean":"내가 가장 좋아하는 계절은 여름입니다. 해변에 가고 바다에서 수영하며 아이스크림을 먹는 것을 좋아합니다. 흐름과 어울리지 않는 문장은?","options":["① 해변에서 모래 놀이를 좋아한다","② 바다에서 수영하는 것이 좋다","③ 더위를 식히려고 아이스크림을 먹는다","④ 지구의 얼음이 빠르게 녹고 있다"],"answer":3},{"english":"Eagles have powerful eyes and can see rabbits up to 3.2 kilometers away. What does “They” refer to?","korean":"독수리는 시력이 매우 좋아 최대 3.2킬로미터 떨어진 토끼도 볼 수 있습니다. They는 무엇을 가리키나요?","options":["ants — 개미","eagles — 독수리","rabbits — 토끼","kilometers — 킬로미터"],"answer":1},{"english":"Zoo safety rules: Don’t feed animals. Don’t enter cages. Keep your voice down. Which is not mentioned?","korean":"동물원 안전 수칙: 동물에게 먹이를 주지 마세요. 우리에 들어가지 마세요. 목소리를 낮추세요. 언급되지 않은 것은?","options":["먹이 주지 않기","사진 찍지 않기","우리에 들어가지 않기","목소리 낮춰 말하기"],"answer":1},{"english":"The writer reduces stress by taking walks outside and listening to favorite music. What is the main idea?","korean":"글쓴이는 산책하며 신선한 공기를 마시고 좋아하는 음악을 들으며 스트레스를 줄입니다. 글의 주제는?","options":["올바른 걷기 자세","대기 오염의 심각성","클래식 음악의 역사","스트레스를 줄이는 방법"],"answer":3},{"english":"I ordered a black cap, but the one I received is brown. I am returning it and ask for my money back.","korean":"검은색 모자를 주문했는데 받은 모자는 갈색입니다. 잘못 온 모자를 돌려보내니 돈을 환불해 달라고 요청합니다.","options":["주문하려고","교환하려고","환불을 요청하려고","분실 신고를 하려고"],"answer":2},{"english":"Reading helps build thinking skills and understanding of others. The writer will explain how to choose the right books.","korean":"독서는 사고력을 기르고 다른 사람의 감정을 이해하는 데 도움이 됩니다. 이어서 적절한 책을 고르는 방법을 설명합니다.","options":["다양한 독서 방법","잘못된 의사소통 사례","창의적인 사람의 특징","적절한 책을 고르는 방법"],"answer":3}]},{"year":2025,"round":1,"label":"2025년 제1회","questions":[{"english":"My parents are really proud of me.","korean":"부모님은 나를 정말 자랑스러워하세요.","options":["excited — 신나는","kind — 친절한","uninterested — 무관심한","proud — 자랑스러운"],"answer":3},{"english":"This question is difficult. Please give me an easy one. Compare the word pairs.","korean":"이 문제는 어렵습니다. 쉬운 문제를 주세요. 두 단어 쌍의 관계를 비교하세요.","options":["wide-narrow: 반의어","wise-foolish: 반의어","healthy-colorful: 관계가 다름","cheap-expensive: 반의어"],"answer":2},{"english":"Eric and I _____ good friends.","korean":"에릭과 나는 좋은 친구_____습니다.","options":["are","am","is","be"],"answer":0},{"english":"He brushed his teeth _____ he had lunch.","korean":"그는 점심을 먹은 _____ 이를 닦았습니다.","options":["to — ~쪽으로","of — ~의","with — ~와 함께","after — ~후에"],"answer":3},{"english":"A: How _____ tickets do you need?\nB: I need three tickets, please.","korean":"A: 표가 몇 장 필요하세요?\nB: 세 장 주세요.","options":["long — 긴","many — 몇/많은","much — 얼마나 많은","often — 자주"],"answer":1},{"english":"A: What are you going to do this afternoon?\nB: I’m going to play computer games with my brother.\nA: _____.","korean":"A: 오늘 오후에 뭐 할 거야?\nB: 남동생과 컴퓨터 게임을 할 거야.\nA: _____.","options":["No, I haven’t — 아니, 해 본 적 없어","You’re welcome — 천만에","Of course not — 당연히 아니지","That sounds fun — 재미있겠다"],"answer":3},{"english":"What _____ of music do you like?\nShe helped me a lot. I think she is very _____.","korean":"어떤 _____ 종류의 음악을 좋아하나요?\n그녀가 많이 도와줬어요. 정말 _____한 사람인 것 같아요.","options":["kind — 종류 / 친절한","fat — 뚱뚱한","well — 잘","light — 가벼운"],"answer":0},{"english":"Mike’s travel schedule: 8 a.m. breakfast at the hotel; 10 a.m. visit the traditional market; 1 p.m. have a snack in the park; 5 p.m. go to the theater. What will he do at 10 a.m.?","korean":"마이크의 여행 일정: 오전 8시 호텔에서 아침 식사, 오전 10시 전통 시장 방문, 오후 1시 공원에서 간식, 오후 5시 극장 가기. 오전 10시에 할 일은?","options":["호텔에서 아침 먹기","전통 시장 방문하기","공원에서 간식 먹기","극장에 가기"],"answer":1},{"english":"A: What is the boy doing?\nB: He is _____.","korean":"A: 소년은 무엇을 하고 있나요?\nB: _____하고 있어요.","options":["watching TV — TV 보기","driving a car — 운전하기","drinking water — 물 마시기","playing the guitar — 기타 연주하기"],"answer":3,"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJcAAACGCAIAAABfd48QAAAwmElEQVR4nO19d1wU1xfvznbYpfcmVUQEAQVsKIIxSgTsDbEFRFSMGnsjGmOJFdTEhiKiKJaoSBALKgKCgqBSpAhIkyosu8v2nXmfcPLmtw+VICLt+f2DzzrO3Ll3zj331HsugmFYnz59Jk+eHBwcTPiGngliV3fgGzoA36jYG/CNir0B36jYG/CNir0B36jYG/CNir0B36jYG/CNir0B36jYG/CNir0B36jYG/CNir0B36jYG/CNir0B36jYG/CNir0BZEJPBoZhCIJgGEYgEBAEkUqlAoGAw+GIxWKJRCIUCgkEgoKCgrKysry8vOyDCIIQehF6NhUJBAKKomlpadevX09PT3/79i2BQJCTk5OXl6fT6RQKBahFJpMdHBwMDAxGjRplbGxMJBKB/ITegh5MRQzDGhsbAwMDHz58OGzYsNGjRzOZTDKZTCQSgUGBTsCpBAKhqqpq165dJBJp+vTpY8eOxTmY0PPRU6mIYdirV68WLVrUt2/fJUuWkEikFiTBf+M/1JohlUrDwsIyMjKWL18uJydH6BXoedoN1oxHjx4FBARMmjRp1KhRQMK2AGmGubl5VVXVzz//jKIozqk9GsQeRz8CgZCWlnbq1KlZs2apq6vjtJFlRPxOWcANRCKxuLiYz+fX1dXduHHjo+33OPQYKsL35fF4ISEhERERo0aNolAorQs27BMk6d+/f3l5uamp6dGjRxsaGoqKiiorK/l8PqHHogfIRSAGiqIPHjw4ePDgwIEDLSwsPkU8rBnv37+XSCTa2tr447JikslkDhgw4MmTJwoKCh4eHvLy8uJmqKioODg4zJw5s1+/fvjNhJ6AHkBFAoHQ0NCwfPny2tpaNzc3eXn51vnv9u3bCgoKDg4O+EVZlRUMD2VlZS0tLRaLZWpq6uTkBP/L4XCKi4tnzZo1dOjQ3bt3KysrE3oIujUVgY2Ki4vnzp1ra2s7atSo1pkDw7CUlBRtbe1BgwbhnCQSiRITE2tra+Xk5Gg0mrq6uqGhoYqKip6eXnl5eWNjI9xJoVDev39vbm4+YMCAlJSUqVOn3rhxQ0FBoUdwZHeXi/X19QsWLHBycho4cOB/3iyRSAoLC21tbXH+EwgEoaGhNBrNyMhITU1NX19fUVExOzs7KSlpwIAB9vb2OMMpKir269cvPT09Jydn2LBhWlpamzZt6inKTvflRQzD+Hz+ggULbG1tTUxM/pMLCc0k19TUJBL/NzUfP34sFAqLiopIJJKcnJympub3339vbGxMo9EoFAqXy+VwODU1NVVVVVQq1c7Ozt7evqCgIDY21sXF5d "korean":"바다중학교 학생들이 좋아하는 과목: 영어 19%, 국어 10%, 체육 40%, 과학 16%, 기타 15%. 가장 좋아하는 과목은?","options":["English — 영어","Korean — 국어","P.E. — 체육","Science — 과학"],"answer":2},{"english":"During a flood, turn off electricity, stay out of moving water, move to higher ground, and listen to news reports. Water the plants regularly. Which sentence does not fit?","korean":"홍수 때에는 전기를 끄고 흐르는 물을 피하며 높은 곳으로 이동하고 뉴스에 귀를 기울이세요. 식물에 정기적으로 물을 주세요. 흐름과 어울리지 않는 문장은?","options":["① 전기를 끈다","② 흐르는 물을 피한다","③ 식물에 정기적으로 물을 준다","④ 높은 지대로 이동한다"],"answer":2},{"english":"Jiho made pencil cases from used clothes and gave them to his classmates. They were surprised. What does “them” refer to?","korean":"지호는 헌 옷으로 필통을 만들어 학교에 가져왔고 반 친구들에게 주었습니다. 친구들은 선물을 받고 놀랐습니다. them은 무엇을 가리키나요?","options":["cups — 컵","teachers — 선생님","classmates — 반 친구들","pencil cases — 필통"],"answer":3},{"english":"Modern Art Museum rules: Don’t run. Don’t eat food. Don’t take pictures. Which rule is not mentioned?","korean":"현대미술관 규칙: 뛰지 않기, 음식 먹지 않기, 사진 찍지 않기. 언급되지 않은 규칙은?","options":["뛰지 않기","낙서하지 않기","음식 먹지 않기","사진 찍지 않기"],"answer":1},{"english":"Eagles have powerful eyes and can see tiny animals from far away. What is the main idea?","korean":"독수리는 강력한 눈을 가지고 있어 높은 곳에서도 작은 개미를 볼 수 있고, 약 2.8킬로미터 떨어진 작은 동물도 볼 수 있습니다. 글의 주제는?","options":["개미의 특성","독수리의 시력","사냥의 역사","시력에 좋은 음식"],"answer":1},{"english":"I have a white jacket with many pockets. It is almost new. I paid $80 and am selling it for $20.","korean":"주머니가 많은 흰 재킷을 팝니다. 거의 새것이며 80달러에 샀지만 20달러에 판매합니다. 글의 목적은?","options":["판매하려고","환불하려고","사과하려고","구입하려고"],"answer":0},{"english":"Brian is Canadian and has lived in Korea for two years. He will give tips for visiting Canada, starting with the best time to visit.","korean":"브라이언은 캐나다 사람이고 한국에서 2년째 살고 있습니다. 캐나다 방문 팁을 알려 주며, 먼저 방문하기 좋은 시기를 소개하려 합니다. 이어질 내용은?","options":["한국의 다양한 날씨","효과적인 영어 학습 방법","자신이 좋아하는 음악 소개","캐나다를 방문하기 좋은 시기"],"answer":3}]},{"year":2025,"round":2,"label":"2025년 제2회","questions":[{"english":"Students are usuall ,{"english":"A: The dance contest is tomorrow. Can you help me practice dancing?\nB: Sure. Let’s practice together.","korean":"A: 댄스 대회가 내일이야. 춤 연습을 도와줄래?\nB: 물론이지. 같이 연습하자. 두 사람이 함께 할 일은?","options":["농구하러 가기","우편물 보내기","사진 찍으러 가기","춤 연습하러 가기"],"answer":3},{"english":"A: Did you enjoy the magic show?\nB: Yes, _____. How about you?\nA: I also enjoyed it. The tricks were amazing.","korean":"A: 마술 쇼 재미있었어?\nB: 응, _____. 너는?\nA: 나도 즐거웠어. 마술이 놀라웠어.","options":["it was wonderful — 정말 멋졌어","we had a boring time — 지루했어","he doesn’t like vegetables — 그는 채소를 좋아하지 않아","I played baseball with my friends — 친구들과 야구했어"],"answer":0},{"english":"A: Are you ready for tomorrow’s trip?\nB: I packed everything, but I don’t have a fan.\nA: Don’t worry. I’ll bring one for you.","korean":"A: 내일 여행 준비됐어?\nB: 짐은 다 쌌는데 선풍기가 없어.\nA: 걱정 마. 내가 하나 가져갈게.","options":["강의 계획","동물 보호","여행 준비","음식 소개"],"answer":2},{"english":"A movie poster lists the title, place, and time. What information is not given?","korean":"영화 포스터에 제목, 상영 장소, 상영 시간은 나와 있습니다. 알 수 없는 것은?","options":["영화 제목","관람 비용","상영 장소","상영 시간"],"answer":1},{"english":"Spend over $50 this week and get a 5% discount. What is the announcement for?","korean":"이번 주에 50달러 넘게 구매하면 5% 할인을 받을 수 있습니다. 방송의 목적은?","options":["지역 특산물 소개","계절 한정 상품 소개","매장 마감 시간 안내","특별 할인 행사 안내"],"answer":3},{"english":"A popular band is performing at the school concert this year. Why does A want to go?","korean":"올해 학교 콘서트에 인기 있는 밴드가 공연합니다. A가 콘서트에 가고 싶어 하는 이유는?","options":["경품 행사가 있어서","무료 사진 촬영이 있어서","수업이 일찍 끝나서","인기 있는 밴드가 공연해서"],"answer":3},{"english":"Forest Adventures was written by famous writer Anna Brown. It is about a girl and a puppy’s friendship and will be sold in bookstores in October. Which is NOT true?","korean":"《숲속 모험》은 유명 작가 애나 브라운이 쓴 책입니다. 소녀와 강아지의 우정을 다루며 10월에 서점에서 판매됩니다. 일치하지 않는 것은?","options":["무명 작가가 썼다","주인공은 소녀와 강아지이다","우정에 관한 이야기이다","서점에서 10월에 살 수 있다"],"answer":0},{"english":"The Pig Festival had 5,500 visitors last year. Its main events are a pig race and fireworks, and food is sold. What is not mentioned?","korean":"돼지 축제에는 작년에 5,500명이 방문했습니다. 주요 행사는 돼지 경주와 불꽃놀이이고 맛있는 음식도 판매합니다. 언급되지 않은 것은?","options":["작년 방문자 수","주차장 위치","주요 행사","판매 음식"],"answer":1},{"english":"Jiho suggested making a list of things to buy because the writer often buys things they do not need.","korean":"필요하지 않은 물건을 자주 사서 걱정하던 글쓴이에게 지호는 살 물건 목록을 만들자고 제안했습니다.","options":["운동화 구매하기","구매 목록 작성하기","가족과 시간 보내기","새로운 친구 사귀기"],"answer":1},{"english":"Favorite sports in class: soccer 40%, baseball 25%, basketball 15%, volleyball 10%, others 10%. Students like _____ the most.","korean":"반에서 좋아하는 운동: 축구 40%, 야구 25%, 농구 15%, 배구 10%, 기타 10%. 가장 인기 있는 운동은?","options":["soccer — 축구","baseball — 야구","basketball — 농구","volleyball — 배구"],"answer":0},{"english":"Robots take orders, make coffee, and guide people. Coffee beans are grown in warm areas. Which sentence does not fit?","korean":"요즘 로봇은 식당에서 주문을 받고, 카페에서 커피를 만들며, 공항에서 안내합니다. 커피콩은 따뜻한 지역에서 자랍니다. 흐름과 어울리지 않는 문장은?","options":["① 로봇이 식당에서 주문을 받는다","② 로봇이 카페에서 커피를 만든다","③ 커피콩은 따뜻한 곳에서 자란다","④ 로봇이 공항에서 안내한다"],"answer":2},{"english":"Tomatoes can keep mosquitoes away. Bowls of crushed tomatoes can help keep these insects out of a room. What does “them” refer to?","korean":"토마토는 모기가 싫어합니다. 으깬 토마토를 그릇에 담아 두면 모기가 방에 들어오지 못하게 할 수 있습니다. them은 무엇을 가리키나요?","options":["bowls — 그릇","trees — 나무","tomatoes — 토마토","mosquitoes — 모기"],"answer":2},{"english":"Theater rules: Don’t take pictures. Don’t make loud noises. Don’t kick the seat in front of you. Which is not mentioned?","korean":"극장 규칙: 사진 찍지 않기, 큰 소리 내지 않기, 앞 좌석 발로 차지 않기. 언급되지 않은 것은?","options":["음식 먹지 않기","사진 찍지 않기","시끄럽게 하지 않기","앞 좌석 발로 차지 않기"],"answer":0},{"english":"Using mobile phones too much can cause dry eyes and neck pain. What is the main idea?","korean":"휴대전화를 너무 많이 사용하면 안구 건조와 목 통증 같은 해로운 영향이 생길 수 있습니다. 글의 주제는?","options":["현명한 시간 관리 방법","영상 편집 기술의 발전","휴대폰 과다 사용의 악영향","주기적인 스트레칭의 중요성"],"answer":2},{"english":"A debate team member is sick and cannot come. Bill asks Steve to join the team. Why was this message written?","korean":"토론 팀원 한 명이 심한 감기에 걸려 금요일 토론에 올 수 없습니다. 빌은 스티브에게 팀에 들어와 도와달라고 부탁합니다.","options":["거절하려고","구매하려고","부탁하려고","환불하려고"],"answer":2},{"english":"The writer has lived in Mexico for three years and will share cultural differences between Mexico and Korea.","korean":"글쓴이는 멕시코에서 3년째 살고 있으며 멕시코와 한국의 문화 차이를 소개하려 합니다. 이어질 내용은?","options":["프랑스 대학에 입학하는 방법","한국에 남아 있는 가족 소식","1년 전 한국으로 이사한 이유","멕시코와 한국의 문화 차이 사례"],"answer":3}]},{"year":2026,"round":1,"label":"2026년 제1회","sourceNote":"회차는 PDF 표지의 제1회 표기를 따랐습니다.","questions":[{"english":"Modern cameras are very simple to use.","korean":"요즘 카메라는 사용하기가 매우 간단합니다.","options":["simple — 단순한","heavy — 무거운","amazing — 신기한","difficult — 어려운"],"answer":0},{"english":"The mouse is tiny and the elephant is huge. Compare: cheap-expensive / far-long / low-high / thin-thick.","korean":"쥐는 아주 작고 코끼리는 아주 큽니다. 단어 쌍의 의미 관계를 비교하세요.","options":["cheap-expensive: 반의어","far-long: 관계가 다름","low-high: 반의어","thin-thick: 반의어"],"answer":1},{"english":"James is good at soccer, but he _____ good at baseball.","korean":"제임스는 축구를 잘하지만 야구는 잘하지 못합니다.","options":["are","aren’t","do","isn’t"],"answer":3},{"english":"You should leave now, _____ you’ll miss the train.","korean":"지금 출발해야 해. 그렇지 않으면 기차를 놓칠 거야.","options":["in — ~안에","or — 그렇지 않으면","to — ~로","with — ~와 함께"],"answer":1},{"english":"A: _____ should I do to stay healthy?\nB: You should exercise regularly.","korean":"A: 건강을 유지하려면 무엇을 해야 하나요?\nB: 규칙적으로 운동해야 해요.","options":["Who — 누구","Why — 왜","What — 무엇","Where — 어디"],"answer":2},{"english":"A: I’m so hungry.\nB: Why don’t we have some pizza?\nA: _____.","korean":"A: 너무 배고파.\nB: 피자 먹는 게 어때?\nA: _____.","options":["Me, neither — 나도 아니야","No, they don’t — 아니, 그들은 안 그래","That would be great — 그러면 정말 좋겠다","It’s good to see her — 그녀를 보니 반가워"],"answer":2},{"english":"I _____ reading comic books.\nShe met her first _____ at the bus stop.","korean":"나는 만화책 읽는 것을 _____해.\n그녀는 버스 정류장에 05. What is the announcement for?","korean":"다음 주 음악 수업 장소가 201호에서 305호로 바뀝니다. 방송의 목적은?","options":["문화의 날 행사 안내","수업 장소 변경 안내","방송부원 모집 안내","학생회 선거 안내"],"answer":1},{"english":"A: Which do you prefer, cats or dogs?\nB: I prefer cats because I think they are cute.","korean":"A: 고양이와 개 중 무엇을 더 좋아하니?\nB: 고양이가 귀엽다고 생각해서 고양이를 더 좋아해. 고양이를 선호하는 이유는?","options":["귀여워서","영리해서","조용해서","활발해서"],"answer":0},{"english":"The Moser lamp is easy to make, eco-friendly, and lights a room without electricity. It is safe because it cannot start a fire. Which is NOT true?","korean":"모저 램프는 만들기 쉽고 친환경적이며 전기 없이 방을 밝힐 수 있습니다. 불이 나지 않아 안전합니다. 일치하지 않는 것은?","options":["알프레도 모저가 발명했다","쉽게 만들 수 있고 환경친화적이다","전기를 사용하지 않고 방을 밝힐 수 있다","화재의 위험이 있어 안전하지 않다"],"answer":3},{"english":"The non la is a Vietnamese hat made of large leaves. It is cone-shaped, protects from the sun, and can be used as an umbrella. What is not mentioned?","korean":"논라는 베트남 사람들이 쓰는 큰 나뭇잎으로 만든 모자입니다. 원뿔 모양이며 햇빛을 막아 주고 비가 올 때 우산처럼 쓸 수 있습니다. 언급되지 않은 것은?","options":["소재","모양","가격","용도"],"answer":2},{"english":"Emma suggested painting pictures on the dirty wall in the school gym.","korean":"학교 체육관 벽이 더러워서 학생 대표 엠마가 벽에 그림을 그리자고 제안했습니다.","options":["교복 물려주기","교실 대청소하기","전기 절약하기","벽에 그림 그리기"],"answer":3},{"english":"Classmates’ birthday wishes: smartphones 45%, bicycles 25%, earphones 13%, watches 10%, books 6%. More students want _____ than bicycles.","korean":"반 친구들의 생일 선물 희망: 스마트폰 45%, 자전거 25%, 이어폰 13%, 시계 10%, 책 6%. 자전거보다 더 많은 학생이 원하는 것은?","options":["smartphones — 스마트폰","earphones — 이어폰","watches — 시계","books — 책"],"answer":0},{"english":"Dogs see blue, yellow, and gray, but not some colors humans see. Dogs are various in size. Which sentence does not fit?","korean":"개는 파랑, 노랑, 회색을 볼 수 있지만 사람이 보는 일부 색은 보지 못합니다. 개는 크기가 다양합니다. 문맥에 어울리지 않는 문장은?","options":["① 개는 파랑, 노랑, 회색을 볼 수 있다","② 사람이 보는 일부 색은 보지 못한다","③ 개는 크기가 다양하다","④ 빨강은 볼 수 없다"],"answer":2},{"english":"I’m making pancakes. I need mix, eggs, milk, and sugar. My friends will like them. What does “them” refer to?","korean":"팬케이크를 만들려고 반죽 가루, 달걀, 우유, 설탕이 필요합니다. 친구들이 팬케이크를 좋아할 것 같습니다. them은 무엇을 가리키나요?","options":["eggs — 달걀","milk — 우유","sugar — 설탕","pancakes — 팬케이크"],"answer":3},{"english":"National Park rules: Don’t ride a bike. Don’t feed birds. Don’t sit on the grass. Which is not mentioned?","korean":"국립공원 규칙: 자전거 타지 않기, 새에게 먹이 주지 않기, 잔디에 앉지 않기. 언급되지 않은 것은?","options":["자전거 타지 않기","쓰레기 버리지 않기","새에게 먹이 주지 않기","잔디에 앉지 않기"],"answer":1},{"english":"To get better grades, listen in class, take notes, finish homework on time, and ask teachers for help. What is the main idea?","korean":"성적을 높이려면 수업을 잘 듣고 필기하며, 숙제를 제시간에 끝내고, 필요할 때 선생님께 도움을 요청하세요. 글의 주제는?","options":["성적 향상 방법","여권 발급 절차","여행 일정 안내","회원 가입 단계"],"answer":0},{"english":"Anne, I was upset that you shared my secret. It was my mistake to yell at you. I want to apologize.","korean":"앤, 네가 내 비밀을 다른 사람에게 말해서 속상했어. 하지만 너에게 소리친 건 내 잘못이야. 상처 주려던 건 아니었어. 사과하고 싶어.","options":["거절하려고","사과하려고","소개하려고","축하하려고"],"answer":1},{"english":"A house reflects its environment and climate. Some homes are made of mud or ice, while others are built in trees or on water. The writer will introduce unique houses around the world.","korean":"집은 그 지역의 환경과 기후를 보여 줍니다. 진흙이나 얼음으로 만든 집도 있고, 나무 위나 물 위에 지은 집도 있습니다. 이어질 내용은?","options":["세계의 독특한 집들","여러 나라의 명절들","환경에 적응한 수중 식물들","실내 안전 수칙들"],"answer":0}]},{"year":2026,"round":2,"label":"2026년 제2회","questions":[{"english":"Because I’m strong, I can carry heavy things.","korean":"나는 힘이 세기 때문에 무거운 것을 들 수 있습니다.","options":["high — 높은","heavy — 무거운","honest — 정직한","creative — 창의적인"],"answer":1},{"english":"My dream job is being a teacher. Compare: left-right / color-yellow / sport-baseball / animal-monkey.","korean":"내 꿈의 직업은 선생님입니다. 단어 쌍의 관계를 비교하세요.","options":["left-right: 반의어","color-yellow: 종류와 예","sport-baseball: 종류와 예","animal-monkey: 종류와 예"],"answer":0},{"english":"My favorite Korean food _____ bibimbap.","korean":"내가 가장 좋아하는 한국 음식은 비빔밥_____니다.","options":["am","do" 3},{"english":"A: What do you think about this T-shirt?\nB: It’s nice, but it’s too big for you.\nA: I agree. Let’s look around more.","korean":"A: 이 티셔츠 어때?\nB: 괜찮지만 너한테 너무 큰 것 같아.\nA: 맞아. 좀 더 둘러보자. 티셔츠를 권하지 않는 이유는?","options":["가격이 비싸서","유행이 지나서","디자인이 단순해서","사이즈가 너무 커서"],"answer":3},{"english":"People in the Andes wear chullos because it is cold. A chullo is a traditional hat with long ear covers and designs of mountains, rivers, and animals. Which is NOT true?","korean":"안데스산맥 사람들은 추워서 추요를 씁니다. 추요는 귀를 덮는 부분이 긴 전통 모자이며 산, 강, 동물 등의 무늬가 있습니다. 오늘날 세계적으로 인기 있는 패션 아이템입니다. 일치하지 않는 것은?","options":["더위를 피하려고 착용한다","긴 귀덮개가 달린 전통 모자이다","산·강·동물 무늬가 있다","세계적으로 인기 있는 패션 아이템이다"],"answer":0},{"english":"The science-fiction book The Best New Thing was written by Isaac Asimov. A family travels from a spaceship to Earth and experiences a new life. What is not mentioned?","korean":"과학 소설 《The Best New Thing》은 미국 작가 아이작 아시모프가 썼습니다. 우주선에 살던 가족이 지구로 와 놀라운 일을 경험하며 새 삶을 즐깁니다. 언급되지 않은 것은?","options":["장르","작가","줄거리","출간 연도"],"answer":3},{"english":"Sumi suggested doing neck-stretching exercises because studying for a long time caused neck pain.","korean":"오래 공부해 목이 아파 수미에게 조언을 구했습니다. 수미는 목 스트레칭 운동을 하라고 제안했습니다.","options":["눈 마사지하기","물 자주 마시기","게임 시간 줄이기","목 스트레칭 운동 하기"],"answer":3},{"english":"Favorite school lunch: bulgogi 42%, pizza 30%, spaghetti 15%, salad 8%, other 5%. Students like _____ the most.","korean":"반 친구들이 좋아하는 급식: 불고기 42%, 피자 30%, 스파게티 15%, 샐러드 8%, 기타 5%. 가장 좋아하는 음식은?","options":["bulgogi — 불고기","pizza — 피자","spaghetti — 스파게티","salad — 샐러드"],"answer":0},{"english":"Sailors believed cats brought good luck and protected ships from bad weather and rats. Rabbits can jump very high. Which sentence does not fit?","korean":"옛날 선원들은 고양이가 행운을 가져오고 배를 나쁜 날씨와 쥐로부터 지켜 준다고 믿었습니다. 토끼는 높이 뛸 수 있습니다. 흐름과 어울리지 않는 문장은?","options":["① 고양이는 행운을 가져온다고 믿었다","② 토끼는 높이 뛸 수 있다","③ 고양이가 배를 위험한 날씨에서 지킨다고 믿었다","④ 고양이는 쥐를 쫓아냈다"],"answer":1},{"english":"Ants in the Sahara can hunt during the hottest time of day because their body hairs protect them from the sun’s heat.","korean":"사하라 사막의 개미는 하루 중 가장 더울 때에도 사냥할 수 있습니다. 몸의 털이 태양열로부터 보호해 주기 때문입니다. them은 무엇을 가리키나요?","options":["ants — 개미","trees — 나무","snakes — 뱀","tomatoes — 토마토"],"answer":0},{"english":"Swimming pool rules: Wear a swimming cap. Do warm-up exercises. Take a break every 30 minutes. Which is not mentioned?","korean":"수영장 규칙: 수영모 쓰기, 준비 운동하기, 30분마다 휴식하기. 언급되지 않은 것은?","options":["수영모 착용하기","준비 운동 하기","뛰어다니지 않기","30분마다 휴식하기"],"answer":2},{"english":"A good leader is friendly, does not try to control people, and listens carefully. What is the main idea?","korean":"좋은 리더는 친절하고 사람들을 통제하려 하지 않으며 다른 사람의 말을 주의 깊게 듣습니다. 글의 주제는?","options":["좋은 리더의 요건","환경오염의 심각성","외국어 학습의 필요성","운동을 해야 하는 이유"],"answer":0},{"english":"The Picasso Art Club is looking for new members. Anyone interested in painting can join. What is the purpose?","korean":"피카소 미술 동아리에서 새 회원을 모집합니다. 그림에 관심이 있다면 누구나 가입할 수 있습니다. 글의 목적은?","options":["감사 인사를 하려고","환불을 요청하려고","분실물을 신고하려고","신규 회원을 모집하려고"],"answer":3},{"english":"Popcorn is popular around the world and has been enjoyed for over 5,000 years. The writer will give examples of ways people enjoy it.","korean":"팝콘은 세계적으로 인기 있는 간식이며 5천 년 넘게 먹어 왔습니다. 사람들이 팝콘을 즐기는 여러 방법을 소개하려 합니다.","options":["감자 재배 시기","다양한 가족의 형태","팝콘을 즐기는 다양한 방법","빈번한 자연재해의 원인"],"answer":2}]}];
const promptTexts=['밑줄 친 단어의 뜻으로 가장 적절한 것은?','두 단어의 의미 관계가 나머지 셋과 다른 것은?','빈칸에 들어갈 말로 가장 적절한 것은?','빈칸에 들어갈 말로 가장 적절한 것은?','대화의 빈칸에 들어갈 말은?','대화의 빈칸에 들어갈 말은?','두 빈칸에 공통으로 들어갈 말은?','표·지도·일정표를 보고 답하세요.','그림을 보고 빈칸에 들어갈 말을 고르세요.','대화를 읽고 답하세요.','대화의 빈칸에 들어갈 말을 고르세요.','대화의 주제로 가장 적절한 것은?','안내문을 보고 알 수 없는 것은?','방송의 목적으로 가장 적절한 것은?','대화의 내용에 답하세요.','글의 내용과 일치하지 않는 것은?','글에서 언급되지 않은 내용 또는 흐름과 어울리지 않는 문장은?','글에서 제안한 내용은?','그래프를 보고 답하세요.','글의 내용에 답하세요.','밑줄 친 말이 가리키는 것은?','규칙으로 언급되지 않은 것은?','글의 주제로 가장 적절한 것은?','글을 쓴 목적으로 가장 적절한 것은?','글의 바로 뒤에 이어질 내용으로 가장 적절한 것은?'];
let round=1,currentExam=null,currentIndex=0,selected=null,checked=false,wrongQueue=null,wrongCursor=0;let state={};try{state=JSON.parse(localStorage.getItem('exam-practice-state')||'{}')}catch{}
function save(){localStorage.setItem('exam-practice-state',JSON.stringify(state))}function key(exam){return `${exam.year}-${exam.round}`}function progress(exam){const k=key(exam);if(!state[k])state[k]={answers:{},correct:{},finished:false,pos:0};return state[k]}
function scoreMap(exam){const p=progress(exam),map={...(p.examResult?.correct||{}),...(p.correct||{})};if(p.reviewCorrect)Object.entries(p.reviewCorrect).forEach(([i,value])=>{map[i]=value});return map}
function getAllWrongItems(){return exams.flatMap(exam=>exam.questions.map((q,index)=>({exam,index,q})).filter(item=>scoreMap(exam)[item.index]===false))}
function updateWrongHome(){const items=getAllWrongItems(),button=document.getElementById('wrongHomeBtn'),summary=document.getElementById('wrongHomeSummary');if(!button||!summary)return;button.disabled=!items.length;button.textContent='남은 오답 풀기';summary.textContent=items.length?`전체 시험에서 아직 틀린 문제 ${items.length}개`:'아직 틀린 문제가 없어요.'}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.getElementById('homebtn').style.display=id==='home'?'none':'block';document.body.classList.toggle('question-mode',id==='quiz');document.getElementById('siteHeader').hidden=id==='quiz';document.getElementById('siteHeader').style.display=id==='quiz'?'none':'flex';window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){currentExam=null;wrongQueue=null;show('home');renderExamList()}
function setRound(n){round=n;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',Number(x.dataset.round)===n));renderExamList()}
function renderExamList(){const tests=exams.filter(x=>x.round===round).sort((a,b)=>a.year-b.year);document.getElementById('round-note').style.display=tests.some(x=>x.sourceNote)?'block':'none';document.getElementById('round-note').textContent=tests.find(x=>x.sourceNote)?.sourceNote||'';document.getElementById('examgrid').innerHTML=tests.map(e=>{const p=progress(e),done=Object.keys(p.correct).length;return `<article class="exam"><div class="emoji">📘</div><div class="exam-copy"><div class="exam-title">${e.label}</div><div class="exam-meta">영어 · 25문항 · ${done}개 풀이 완료 ${e.sourceNote?`<br><small>${e.sourceNote}</small>`:''}</div></div><button class="button" onclick="startExam(${e.year},${e.round})">${done?'이어 풀기':'풀기'}</button></article>`}).join('');updateWrongHome()}
function startExam(year,r,idx=null){wrongQueue=null;currentExam=exams.find(x=>x.year===year&&x.round===r);if(!currentExam)return;const p=progress(currentExam);currentIndex=idx??p.pos??0;renderQuestion();show('quiz')}
function startWrongReview(examFilter=null){const items=getAllWrongItems().filter(item=>!examFilter||key(item.exam)===key(examFilter));if(!items.length)return;wrongQueue=items;wrongCursor=0;currentExam=wrongQueue[0].exam;currentIndex=wrongQueue[0].index;renderQuestion();show('quiz')}
function quickPractice(){const candidates=exams.filter(e=>e.questions.length);const e=candidates[Math.floor(Math.random()*candidates.length)],q=Math.floor(Math.random()*e.questions.length);startExam(e.year,e.round,q)}
function renderQuestion(){const q=currentExam.questions[currentIndex],p=progress(currentExam);p.pos=currentIndex;save();selected=wrongQueue?(p.reviewAnswers&&Object.hasOwn(p.reviewAnswers,currentIndex)?p.reviewAnswers[currentIndex]:null):(Object.hasOwn(p.answers,currentIndex)?p.answers[currentIndex]:null);checked=wrongQueue?(p.reviewCorrect&&Object.hasOwn(p.reviewCorrect,currentIndex)):Object.hasOwn(p.correct,currentIndex);document.getElementById('number').textContent=`${currentIndex+1}번`;document.getElementById('prompt').textContent=promptTexts[currentIndex]||'다음 문제를 풀어 보세요.';document.getElementById('english').innerHTML=(q.image?`<img class="question-figure" src="${q.image}" alt="문제 그림">`:'')+`<div class="question-text">${escapeHtml(q.english)}</div>`;document.getElementById('korean').textContent=q.korean;document.getElementById('translation').style.display=checked?'block':'none';document.getElementById('progressText').textContent=wrongQueue?`오답 ${wrongCursor+1} / ${wrongQueue.length}`:`${currentIndex+1} / ${currentExam.questions.length}`;document.getElementById('bar').style.width=wrongQueue?`${(wrongCursor+1)/wrongQueue.length*100}%`:`${(currentIndex+1)/currentExam.questions.length*100}%`;document.getElementById('options').innerHTML=q.options.map((o,i)=>`<button class="option" data-i="${i}"><span class="optno">${['①','②','③','④'][i]}</span><span>${escapeHtml(o)}</span></button>`).join('');const btns=[...document.querySelectorAll('.option')];btns.forEach((b,i)=>{if(selected===i)b.classList.add('selected');if(checked&&i===q.answer&&(selected===q.answer||wrongQueue))b.classList.add('correct');if(checked&&selected===i&&i!==q.answer)b.classList.add('wrong');b.onclick=()=>{if(checked)return;selected=i;checked=false;const p=progress(currentExam);if(wrongQueue){if(p.reviewCorrect)delete p.reviewCorrect[currentIndex];if(!p.reviewAnswers)p.reviewAnswers={};p.reviewAnswers[currentIndex]=i}else{delete p.correct[currentIndex];p.answers[currentIndex]=i}document.getElementById('translation').style.display='none';document.getElementById('checkBtn').style.display='inline-block';document.getElementById('nextBtn').style.display='none';btns.forEach(x=>x.classList.remove('selected','correct','wrong'));b.classList.add('selected');const fb=document.getElementById('feedback');fb.className='feedback';fb.textContent='';save()}});const fb=document.getElementById('feedback');fb.className='feedback'+(checked?' show '+(selected===q.answer?'ok':'no'):'');fb.textContent=checked?(wrongQueue?(selected===q.answer?'복습 정답이에요.':'복습 오답이에요.'):(selected===q.answer?'맞았어요!':'틀렸어요.')):'';document.getElementById('checkBtn').style.display=checked?'none':'inline-block';document.getElementById('checkBtn').textContent='정답 확인';document.getElementById('nextBtn').style.display=checked?'inline-block':'none';document.getElementById('nextBtn').textContent=wrongQueue?(wrongCursor===wrongQueue.length-1?'복습 결과 보기':'다음 오답'):(currentIndex===currentExam.questions.length-1?'결과 보기':'다음 문제');document.getElementById('pager').innerHTML=wrongQueue?'':currentExam.questions.map((_,i)=>`<button class="${i===currentIndex?'current':''} ${Object.hasOwn(p.correct,i)?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}
function checkAnswer(){if(selected===null){document.getElementById('feedback').className='feedback show no';document.getElementById('feedback').textContent='보기를 하나 골라 주세요.';return}const q=currentExam.questions[currentIndex],p=progress(currentExam);if(wrongQueue){if(!p.reviewAnswers)p.reviewAnswers={};if(!p.reviewCorrect)p.reviewCorrect={};p.reviewAnswers[currentIndex]=selected;p.reviewCorrect[currentIndex]=selected===q.answer}else{p.answers[currentIndex]=selected;p.correct[currentIndex]=selected===q.answer}p.pos=currentIndex;save();checked=true;renderQuestion()}
function jump(i){if(wrongQueue)return;currentIndex=i;renderQuestion()}
function prevQuestion(){if(wrongQueue){if(wrongCursor>0){wrongCursor--;currentExam=wrongQueue[wrongCursor].exam;currentIndex=wrongQueue[wrongCursor].index;renderQuestion()}return}if(currentIndex>0){currentIndex--;renderQuestion()}}
function nextQuestion(){if(wrongQueue){wrongCursor++;if(wrongCursor<wrongQueue.length){currentExam=wrongQueue[wrongCursor].exam;currentIndex=wrongQueue[wrongCursor].index;renderQuestion()}else finishWrongReview();return}if(currentIndex<currentExam.questions.length-1){currentIndex++;renderQuestion()}else showResult()}
function finishWrongReview(){const completed=[...wrongQueue],fixed=completed.filter(item=>progress(item.exam).reviewCorrect?.[item.index]===true).length;wrongQueue=null;const remaining=getAllWrongItems();document.getElementById('resultExam').textContent='틀린 문제 모아보기 완료';document.getElementById('score').textContent=`${fixed} / ${completed.length}`;document.getElementById('scoreText').textContent=`이번에 다시 맞힌 문제 ${fixed}개 · 남은 오답 ${remaining.length}개${remaining.length?' · 아래 버튼으로 이어서 풀 수 있어요':''}`;const retryBtn=document.getElementById('retryWrongBtn');retryBtn.style.display=remaining.length?'inline-block':'none';retryBtn.textContent='남은 오답 다시 풀기';retryBtn.onclick=()=>startWrongReview();document.getElementById('wrongList').innerHTML=remaining.length?`<h3>아직 틀린 문제</h3>${remaining.map(item=>`<div class="wrong-item"><b>${item.exam.label} · ${item.index+1}번.</b> ${escapeHtml(item.q.korean)}</div>`).join('')}`:'<p>모든 오답을 다시 맞혔어요!</p>';show('result');renderExamList()}
function showResult(){const p=progress(currentExam),total=currentExam.questions.length;if(!p.examResult){p.examResult={correct:{...p.correct},answers:{...p.answers}};save()}const result=p.examResult,score=scoreMap(currentExam),remaining=currentExam.questions.map((q,i)=>i).filter(i=>score[i]===false),correct=Object.values(score).filter(Boolean).length;document.getElementById('resultExam').textContent=currentExam.label;document.getElementById('score').textContent=`${correct} / ${total}`;document.getElementById('scoreText').textContent=`현재 점수 · ${total}문제 중 ${correct}문제 정답 · ${remaining.length}문제 오답`;const retryBtn=document.getElementById('retryWrongBtn');retryBtn.style.display=remaining.length?'inline-block':'none';retryBtn.textContent='이 시험 오답만 다시 풀기';retryBtn.onclick=()=>startWrongReview(currentExam);document.getElementById('wrongList').innerHTML=remaining.length?`<h3>다시 풀 문제</h3>${remaining.map(i=>`<div class="wrong-item"><b>${i+1}번.</b> ${escapeHtml(currentExam.questions[i].korean)}</div>`).join('')}`:'<p>모든 문제를 맞혔어요!</p>';p.finished=true;save();show('result')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderExamList();
</script></body></html>
